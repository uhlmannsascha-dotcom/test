    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }

    <!-- Embedded Local Tailwind & Custom Theme CSS -->
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .dark body {
            background-color: #020617;
            color: #f8fafc;
        }

        html:not(.dark) body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeIn {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #06b6d4;
            outline: none;
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25);
        }

        /* Select Option Styling */
        .dark option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        html:not(.dark) option {
            background-color: #ffffff !important;
            color: #0f172a !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .dark ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }

        .dark ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.9);
            border-radius: 4px;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.9);
        }

        html:not(.dark) ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        html:not(.dark) ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        html:not(.dark) ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }
    </style>
    <script>
        try {
            if (localStorage.getItem("xal_theme") !== "dark") {
                document.documentElement.classList.remove("dark");
            }
        } catch (e) { }
    </script>

            const bMin = area.bMin !== undefined ? parseSimNum(area.bMin) : Math.round(bLikely * 0.6);

                res: area.res !== undefined ? parseSimNum(area.res, 10) : 10,

                end: area.endDate || area.end || "2027-03-31",

        function runSimStage1(ideas) {
            return ideas.map(i => {
                const netROI = Math.max(1, i.bLikely - i.cost);
                const roiNorm = Math.min(1, Math.log10(netROI + 1) / Math.log10(1001));
                const prioVal = SIM_PRIO_M[i.prio] ?? 0.5;
                const statusVal = SIM_STATUS_M[i.status] ?? 0.3;
                const score = Math.round(100 * (0.45 * roiNorm + 0.25 * prioVal + 0.20 * (1 - Math.min(0.4, i.risk / 25)) + 0.10 * statusVal));
                return {

            });

        function runSimStage2(ideas, mcRunsCount = 5000) {
            const runs = Math.min(50000, Math.max(100, parseSimNum(mcRunsCount, 5000)));
            const scored = runSimStage1(ideas);
            const updated = scored.map(i => {
                const vals = [];
                for (let r = 0; r < runs; r++) {
                    const success = Math.random() < i.conf / 10;
                    vals.push((success ? simTri(i.bMin, i.bLikely, i.bMax, Math.random()) : 0) - i.cost);
                }
                vals.sort((a, b) => a - b);
                const eNet = vals.reduce((s, v) => s + v, 0) / runs;
                const p10 = vals[Math.floor(runs * 0.10)];
                const p90 = vals[Math.floor(runs * 0.90)];
                const lossProb = vals.filter(v => v < 0).length / runs;
                return {
                    ...i,
                    eNet,
                    p10,
                    p90,
                    lossProb
                };
            });
            const sorted = [...updated].sort((a, b) => b.eNet - a.eNet);

        function runSimSchedule(ideas, fixMap, hFrom, hTo, budgetQInput, capQInput, strategicAreas = [], workPackages = []) {
            const qs = getSimQuarters(hFrom, hTo);
            const P = qs.length;
            const bQ = Array(P).fill(0).map((_, k) => {

                return parseSimNum(budgetQInput, 150);
            });
            const cQ = Array(P).fill(0).map((_, k) => {
                if (Array.isArray(capQInput) && capQInput[k] !== undefined) return parseSimNum(capQInput[k], 18);
                return parseSimNum(capQInput, 18);
            });
            const baseResQ = Array(P).fill(0);
            (workPackages || []).forEach(wp => {
                const st = (wp.status || "").toLowerCase();
                if (st !== "closed" && st !== "completed" && wp.effortHours > 0) {
                    const wpStart = wp.startDate || "2026-10-01";
                    const wpEnd = wp.dueDate || "2026-12-31";
                    const startQ = simQIndexOfDate(wpStart, qs);
                    const endQ = simQIndexOfDate(wpEnd, qs);
                    const durQ = Math.max(1, endQ - startQ + 1);
                    const fteWPerQ = parseSimNum(wp.effortHours, 40) / 40 / durQ;
                    for (let k = 0; k < durQ && startQ + k < P; k++) {
                        baseResQ[startQ + k] += fteWPerQ;
                    }
                }
            });
            const usedCost = Array(P).fill(0);
            const usedRes = [...baseResQ];
            const result = {};

            // 1) Book fixed commitments from Strategic Areas (Implementation & Planning stages)
            const fixedCommitments = (strategicAreas || []).filter(a => {
                const stage = getAreaStage(a);
                return stage === "Implementation" || stage === "Planning";
            });
            fixedCommitments.forEach(fa => {
                const simFa = mapAreaToSimIdea(fa);
                const sDate = fa.startDate || simFa.start || hFrom;
                const sq = simQIndexOfDate(sDate, qs);
                const p = simProfileIdea(simFa, sq, qs);
                p.costQ.forEach((c, k) => usedCost[k] += c);
                p.resQ.forEach((r, k) => {
                    usedRes[k] += r;
                    baseResQ[k] += r;
                });
                result[fa.id] = {
                    sel: true,
                    startQ: p.sq,
                    durQ: p.durQ,
                    fixed: true
                };
            });

            // Handle manual start overrides for candidate ideas
            ideas.forEach(i => {
                const fixedStart = fixMap[i.id];
                if (fixedStart !== undefined && !result[i.id]) {
                    const p = simProfileIdea(i, fixedStart, qs);
                    p.costQ.forEach((c, k) => usedCost[k] += c);
                    p.resQ.forEach((r, k) => usedRes[k] += r);
                    result[i.id] = {
                        sel: true,
                        startQ: p.sq,
                        durQ: p.durQ,
                        fixed: true
                    };
                }
            });

            // 2) Greedy selection by Net Benefit Density
            const rest = ideas.filter(i => !result[i.id]);
            rest.sort((a, b) => (b.eNet || 0) / Math.max(1, b.cost) - (a.eNet || 0) / Math.max(1, a.cost));
            const tryPlace = i => {
                const durQ = Math.max(1, Math.ceil(simMonthsBetween(i.start, i.end) / 3));
                let minQ = 0;
                i.deps.forEach(d => {
                    const r = result[d];
                    if (r && r.sel) minQ = Math.max(minQ, r.startQ + r.durQ);
                });
                for (let sq = minQ; sq + durQ <= P; sq++) {
                    let ok = true;
                    for (let k = 0; k < durQ; k++) {
                        const b = usedCost[sq + k] + i.cost / durQ;
                        const r = usedRes[sq + k] + i.res / durQ;
                        if (b > bQ[sq + k] + 1e-9 || r > cQ[sq + k] + 1e-9) {
                            ok = false;
                            break;
                        }
                    }
                    if (ok) {
                        for (let k = 0; k < durQ; k++) {
                            usedCost[sq + k] += i.cost / durQ;
                            usedRes[sq + k] += i.res / durQ;
                        }
                        result[i.id] = {
                            sel: true,
                            startQ: sq,

                    }

            let pending = [...rest];

                pending.forEach(i => {

                        startQ: null,
                        durQ: null

                usedRes,
                baseResQ,
                budgetQ: bQ,

                P,
